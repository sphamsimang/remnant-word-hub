<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#9e1b22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Msimang Bible Reading • KJV, NKJV & Classic AMPC Study Bible</title>
  <meta name="description" content="Msimang Bible Reading: 365-Day Reading Plan & Finish Tracker, KJV, NKJV & Classic Amplified (AMPC) Parallel Study Bible with Historical Context, Study Notes, Original BDB/Thayer's Strong's Lexicon, and Personal Notes synced to Cloud." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Clean BibleGateway-Inspired Top Bar -->
  <header class="bgw-header">
    <div class="bgw-header-inner">
      <!-- Brand + Desktop Pane Toggles -->
      <div class="bgw-brand-area">
        <div class="bgw-logo" onclick="window.setMobilePane('scripture')" title="Msimang Bible Reading">
          <div class="bgw-logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </div>
          <span class="bgw-logo-text">Msimang Bible Reading</span>
        </div>

        <div class="util-group desktop-pane-toggles" title="Show or Hide Side Panels">
          <button id="toggle-left-pane-btn" class="util-btn active-pane-toggle" onclick="window.toggleDesktopPane('left')">◧ Plan</button>
          <button id="toggle-right-pane-btn" class="util-btn active-pane-toggle" onclick="window.toggleDesktopPane('right')">Notes ◨</button>
        </div>
      </div>

      <!-- Unified Passage Search & Version Selector (NKJV, KJV, Classic AMPC & Parallel) -->
      <form class="bgw-search-bar" onsubmit="window.handlePassageSearch(event)">
        <button type="button" class="bgw-books-trigger" onclick="window.openBookPickerModal()" title="Browse all 66 Books & 1,189 Chapters">
          <span>📚</span>
          <span id="header-active-ref">John 1</span>
          <span style="font-size:0.68rem;color:var(--text-muted);">▾</span>
        </button>

        <input
          type="text"
          id="passage-search-input"
          class="bgw-passage-input"
          placeholder="Passage (e.g. John 1, Rom 8, Ps 23)..."
          aria-label="Search Bible passage"
        />

        <select id="header-version-select" class="bgw-version-select" onchange="window.setReaderVersionMode(this.value)" aria-label="Select Bible Version">
          <option value="nkjv">NKJV</option>
          <option value="kjv">KJV</option>
          <option value="ampc">AMPC (Classic)</option>
          <option value="nkjv_ampc">NKJV + AMPC</option>
          <option value="kjv_nkjv">KJV + NKJV</option>
          <option value="kjv_ampc">KJV + AMPC</option>
          <option value="all3" selected>KJV + NKJV + AMPC</option>
        </select>

        <button type="submit" class="bgw-search-submit" title="Go to Passage">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="desktop-label">Go</span>
        </button>
      </form>

      <!-- Utilities: Font Size, Dark Mode, Login & Cloud Sync -->
      <div class="bgw-utilities">
        <div class="util-group" title="Adjust Scripture Font Size">
          <button type="button" class="util-btn" onclick="window.adjustScriptureFontSize(-1)" aria-label="Decrease Font Size">A-</button>
          <button type="button" class="util-btn" onclick="window.adjustScriptureFontSize(1)" aria-label="Increase Font Size">A+</button>
        </div>

        <div class="util-group">
          <button type="button" id="dark-mode-toggle-btn" class="util-btn" onclick="window.toggleTheme()" title="Toggle Light / Dark Mode" aria-label="Toggle Dark Mode">
            🌙
          </button>
        </div>

        <button type="button" id="cloud-sync-header-btn" class="cloud-login-btn" onclick="window.openCloudSyncModal()" title="Login & Sync to Cloud">
          <span>☁️</span>
          <span class="desktop-label">Sign In</span>
        </button>
      </div>
    </div>
  </header>

  <!-- =======================================================================
       3-COLUMN WORKSPACE
       LEFT: Reading Plan & Tracker | CENTER: Study Bible | RIGHT: Notes & Lexicon
       ======================================================================= -->
  <main id="main-workspace" class="bgw-workspace">

    <!-- LEFT COLUMN: 365-DAY BIBLE READING PLAN & COMPLETION TRACKER -->
    <aside id="pane-left-plan" class="left-plan-pane" aria-label="Bible Reading Plan and Tracker">
      <div class="pane-section-header">
        <div>
          <div class="pane-eyebrow">365-Day Yearly Plan</div>
          <h2 class="pane-title">Reading Plan & Tracker</h2>
        </div>
        <input
          type="date"
          id="plan-start-input"
          class="clean-input"
          style="width:auto;padding:0.28rem 0.45rem;font-size:0.74rem;"
          title="Change 365-Day Plan Start Date"
          onchange="window.updatePlanStartDate(this.value)"
        />
      </div>

      <div id="tracker-summary-panel" class="tracker-summary-card"></div>
      <div id="today-assignment-panel" class="today-plan-card"></div>

      <div>
        <div style="margin-bottom:0.45rem;">
          <input
            type="text"
            class="clean-input"
            placeholder="Search Day # or Book..."
            oninput="window.setTileSearch(this.value)"
            style="padding:0.42rem 0.65rem;font-size:0.78rem;"
          />
        </div>
        <div style="display:flex;gap:0.28rem;flex-wrap:wrap;">
          <button class="user-topic-chip tile-filter-btn active" data-filter="all" onclick="window.setTileFilter('all')">All 365</button>
          <button class="user-topic-chip tile-filter-btn" data-filter="remaining" onclick="window.setTileFilter('remaining')">Left</button>
          <button class="user-topic-chip tile-filter-btn" data-filter="completed" onclick="window.setTileFilter('completed')">Done ✓</button>
          <button class="user-topic-chip tile-filter-btn" data-filter="ot" onclick="window.setTileFilter('ot')">OT</button>
          <button class="user-topic-chip tile-filter-btn" data-filter="nt" onclick="window.setTileFilter('nt')">NT</button>
        </div>

        <div id="sidebar-tiles-list" class="sidebar-tiles-list"></div>
      </div>
    </aside>

    <!-- CENTER COLUMN: STUDY BIBLE CONTEXT + KJV / NKJV / CLASSIC AMPC SCRIPTURE -->
    <section id="pane-center-scripture" class="center-scripture-pane mobile-active" aria-label="Bible Scripture Reading">
      <div id="scripture-chapter-header" class="scripture-top-bar"></div>

      <!-- Clean Study Bible Page Options Strip -->
      <div class="bgw-page-options">
        <div style="display:flex;gap:0.38rem;flex-wrap:wrap;">
          <button id="opt-context-btn" class="option-chip active" onclick="window.toggleStudyContextBox()">
            📖 Chapter Context: ON
          </button>
          <button id="opt-study-notes-btn" class="option-chip active" onclick="window.toggleInlineStudyNotes()">
            📑 Study Bible Notes: ON
          </button>
          <button id="opt-strongs-btn" class="option-chip active" onclick="window.toggleStrongsVisibility()">
            🔎 Strong's: ON
          </button>
          <button id="opt-map-btn" class="option-chip" onclick="window.toggleChapterMap()">
            🗺️ Map
          </button>
        </div>
      </div>

      <!-- STUDY BIBLE BOOK & CHAPTER CONTEXT (Author, Written To, Historical Times & Chapter Context) -->
      <div id="reader-study-context-box" class="study-bible-header-box"></div>

      <!-- Verses Flow (Single or Parallel KJV / NKJV / Classic AMPC + Study Bible Notes) -->
      <div id="reader-verses-container" class="bgw-verses-flow"></div>

      <!-- Bottom Chapter Navigation -->
      <div id="reader-chapter-footer" class="chapter-bottom-nav"></div>
    </section>

    <!-- RIGHT COLUMN: CLEAN, SIMPLE REFLECT & NOTES + ORIGINAL BDB/THAYER'S/STRONG'S LEXICON -->
    <aside id="pane-right-reflect" class="right-reflect-pane" aria-label="Personal Notes and Original Lexicon">
      <div class="pane-section-header">
        <h2 class="pane-title">Reflect & Lexicon</h2>
        <button class="btn-secondary" style="padding:0.25rem 0.55rem;font-size:0.71rem;" onclick="window.exportAllStudyData()" title="Download JSON Backup">
          ⬇ Backup
        </button>
      </div>

      <!-- Simple 2-Tab Switcher: Notes | Lexicon -->
      <div class="reflect-tabs">
        <button class="reflect-tab-btn active" data-rtab="notes" onclick="window.switchReflectTab('notes')">
          ✍️ Notes (<span id="notes-count-badge">0</span>)
        </button>
        <button class="reflect-tab-btn" data-rtab="lexicon" onclick="window.switchReflectTab('lexicon')">
          🔎 Lexicon (BLB)
        </button>
      </div>

      <!-- Subpanel 1: Minimal, Calm Personal Reflection & Notes -->
      <div id="rpanel-notes" class="reflect-subpanel active">
        <form id="study-log-form" onsubmit="window.saveNewStudyLog(event)" style="background:var(--bg-paper);border:1px solid var(--border-line);border-radius:10px;padding:0.85rem;margin-bottom:0.95rem;">
          <input type="hidden" id="log-edit-id" value="" />

          <div style="display:flex;gap:0.45rem;margin-bottom:0.55rem;">
            <input
              type="text"
              id="log-passage-input"
              class="clean-input"
              style="flex:1;padding:0.42rem 0.6rem;font-size:0.79rem;font-weight:700;"
              placeholder="Passage (e.g. John 1:14)"
              title="Verse or Passage Reference"
              required
            />
            <input
              type="text"
              id="log-topic-input"
              list="user-studied-topics-datalist"
              class="clean-input"
              style="width:44%;padding:0.42rem 0.6rem;font-size:0.78rem;"
              placeholder="#Topic (optional)"
              title="Optional personal topic tag"
            />
            <datalist id="user-studied-topics-datalist"></datalist>
          </div>

          <textarea
            id="log-body-input"
            class="clean-textarea"
            style="min-height:105px;margin-bottom:0.55rem;border-color:var(--border-line);"
            placeholder="Write your reflection or study note here..."
            required
          ></textarea>

          <div style="display:flex;gap:0.45rem;">
            <button type="submit" id="save-note-submit-btn" class="btn-crimson" style="flex:1;padding:0.48rem;">
              Save Note
            </button>
            <button type="button" id="cancel-edit-note-btn" class="btn-secondary" style="display:none;padding:0.48rem 0.7rem;" onclick="window.resetNoteComposer()">
              Cancel
            </button>
          </div>
        </form>

        <!-- Clean Filter Strip + Personal Topics (Only visible when user has notes) -->
        <div id="notes-filter-area" style="margin-bottom:0.7rem;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:0.4rem;margin-bottom:0.45rem;">
            <div style="display:flex;gap:0.28rem;">
              <button class="user-topic-chip notes-scope-btn active" data-scope="all" onclick="window.setNotesScope('all')">All</button>
              <button class="user-topic-chip notes-scope-btn" data-scope="chapter" onclick="window.setNotesScope('chapter')">This Chapter</button>
            </div>
            <input
              type="text"
              id="notes-search-input"
              class="clean-input"
              style="max-width:155px;padding:0.3rem 0.55rem;font-size:0.75rem;"
              placeholder="Search notes..."
              oninput="window.renderStudyLogs()"
            />
          </div>
          <div id="personal-topics-cloud" class="personal-topics-cloud"></div>
        </div>

        <div id="study-logs-list"></div>
      </div>

      <!-- Subpanel 2: 100% Verbatim Original Lexicon (BDB 1906 / Thayer's 1889 / Strong's 1890) -->
      <div id="rpanel-lexicon" class="reflect-subpanel">
        <div class="field-group" style="margin-bottom:0.65rem;">
          <input
            type="text"
            class="clean-input"
            placeholder="Search Strong's # or English/Greek/Hebrew (e.g. G3056, H7225, grace)..."
            oninput="window.searchStrongsConcordance(this.value)"
          />
          <div id="concordance-search-results"></div>
        </div>

        <div id="blb-lexicon-content"></div>
      </div>
    </aside>

  </main>

  <!-- Mobile Bottom 3-Pane Switcher -->
  <nav class="mobile-pane-bar" aria-label="Mobile Workspace Switcher">
    <button class="mob-pane-btn" data-mpane="plan" onclick="window.setMobilePane('plan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Plan (<span id="mob-plan-pct">0%</span>)</span>
    </button>
    <button class="mob-pane-btn active" data-mpane="scripture" onclick="window.setMobilePane('scripture')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Scripture</span>
    </button>
    <button class="mob-pane-btn" data-mpane="reflect" onclick="window.setMobilePane('reflect')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>Notes & Lexicon</span>
    </button>
  </nav>

  <!-- 66-Book / 1,189-Chapter Picker Modal -->
  <div id="book-picker-modal" class="modal-backdrop" onclick="if(event.target === this) window.closeBookPickerModal()">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="Select Bible Book and Chapter">
      <div class="modal-header">
        <div>
          <div class="pane-eyebrow">66 Books • 1,189 Chapters</div>
          <h3 class="pane-title" style="font-size:1.12rem;">Select Book & Chapter</h3>
        </div>
        <button class="btn-secondary" style="padding:0.35rem 0.65rem;" onclick="window.closeBookPickerModal()" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.85rem;">
          <div style="display:flex;gap:0.35rem;flex-wrap:wrap;">
            <button class="user-topic-chip picker-testament-btn active" data-t="ALL" onclick="window.setPickerTestament('ALL')">All (66)</button>
            <button class="user-topic-chip picker-testament-btn" data-t="OT" onclick="window.setPickerTestament('OT')">Old Testament (39)</button>
            <button class="user-topic-chip picker-testament-btn" data-t="NT" onclick="window.setPickerTestament('NT')">New Testament (27)</button>
          </div>
          <input type="text" id="picker-book-search" class="clean-input" placeholder="Filter books..." oninput="window.renderBookPickerContent()" style="max-width:200px;" />
        </div>
        <div id="picker-books-grid" class="books-grid"></div>
        <div id="picker-chapters-section" style="margin-top:1.15rem;padding-top:1rem;border-top:1px solid var(--border-line);"></div>
      </div>
    </div>
  </div>

  <!-- Supabase Cloud Sync & Login Modal -->
  <div id="cloud-sync-modal" class="modal-backdrop" onclick="if(event.target === this) window.closeCloudSyncModal()">
    <div class="modal-sheet" style="max-width:430px;" role="dialog" aria-modal="true" aria-label="Cloud Account and Sync">
      <div class="modal-header">
        <div>
          <div class="pane-eyebrow">Msimang Bible Reading</div>
          <h3 class="pane-title" style="font-size:1.12rem;">Account & Cloud Sync</h3>
        </div>
        <button class="btn-secondary" style="padding:0.35rem 0.65rem;" onclick="window.closeCloudSyncModal()" aria-label="Close">✕</button>
      </div>
      <div id="cloud-sync-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
  <script src="data/bible-data.js"></script>
  <script src="data/study-bible-context.js"></script>
  <script src="js/app.js"></script>
  <script src="js/supabase-sync.js"></script>
</body>
</html>
